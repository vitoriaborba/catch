<a class="game-card" [routerLink]="href" [attr.aria-label]="'Play Game ' + number + ': ' + title">
  <div class="card-index"><span>GAME</span><strong>{{ number }}</strong></div>
  <div class="card-content">
    <p class="card-kicker">NOW PLAYING</p>
    <h3>{{ title }}</h3>
    <p class="card-description">{{ description }}</p>
    <span class="card-action">PLAY NOW <span aria-hidden="true">&gt;</span></span>
  </div>
  <span class="card-corner" aria-hidden="true"></span>
</a>
